<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Tech Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6"/>
    <!-- Outer Glow Circle -->
    <circle cx="50" cy="50" r="38" fill="#fdf2f8" fill-opacity="0.15" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#softGlow)"/>
    
    <!-- Stylized Face Profile / Radiance Silhouette -->
    <path d="M48 24 C58 24, 68 32, 68 45 C68 56, 61 64, 52 70 C47 73, 44 76, 42 80 C40 80, 38 78, 38 75 C38 68, 43 62, 47 57 C51 52, 53 48, 53 43 C53 35, 46 30, 39 32 C34 33, 31 38, 31 43 C31 46, 29 48, 26 48 C23 48, 22 45, 22 41 C22 31, 34 24, 48 24 Z" 
          fill="url(#primaryGrad)" />
    
    <!-- AI Sensor Nodes -->
    <circle cx="68" cy="34" r="3.5" fill="#06b6d4" />
    <line x1="68" y1="34" x2="60" y2="42" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
    
    <circle cx="64" cy="56" r="3" fill="#8b5cf6" />
    <circle cx="34" cy="62" r="3" fill="#ec4899" />
    
    <!-- Sparkle Star -->
    <path d="M68 20 L70 26 L76 28 L70 30 L68 36 L66 30 L60 28 L66 26 Z" fill="#ec4899" opacity="0.9"/>
  </g>

  <!-- Typography: skincare AI -->
  <g transform="translate(125, 68)">
    <text font-family="'Cairo', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#1e293b" class="logo-text-main">skincare </tspan><tspan fill="url(#aiGrad)" font-weight="900">AI</tspan>
    </text>
    <text x="3" y="24" font-family="'Tajawal', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.5">
      AI SKIN DIAGNOSTICS & CARE • تحليل البشرة بالذكاء الاصطناعي
    </text>
  </g>
</svg>
